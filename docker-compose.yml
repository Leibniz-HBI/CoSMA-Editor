secrets:
  cosmae_db_password:
    external: true
  cosmae_db_user:
    external: true
  cosmae_db_name:
    external: true
  cosmae_django_key:
    external: true
  cosmae_redis_password:
    external: true
  cosmae_redis_conf:
    external: true
  orcid_client_id:
    external: true
  orcid_client_secret:
    external: true
  email_host:
    external: true
  email_host_user:
    external: true
  email_host_password:
    external: true

volumes:
  cosmae_db_volume:
  cosmae_redis_volume:

services:
  ssh:
    build:
      context: ./
      dockerfile: container/ssh_dockerfile
    volumes:
      - ${HOST_DATA_DIR-/srv/csoame}/ssh:/etc/ssh:ro
      - ${HOST_DATA_DIR-/srv/csoame}/credentials:/credentials:ro
      - ${HOST_DATA_DIR-/srv/csoame}/home:/srv/cosmae/home:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 1709:1709
    image: 127.0.0.1:5000/cosmae_ssh
  ui:
    build:
      context: ./
      dockerfile: container/ui_dockerfile
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - /etc/localtime:/etc/localtime:ro
    image: 127.0.0.1:5000/cosmae_ui
    # command: [nginx-debug, '-g', 'daemon off;']

  queue_worker:
    build:
      context: ./
      dockerfile: container/django_dockerfile
    restart: unless-stopped
    secrets:
      - cosmae_django_key
      - cosmae_db_name
      - cosmae_db_user
      - cosmae_db_password
      - cosmae_redis_password
      - orcid_client_id
      - orcid_client_secret
      - email_host
      - email_host_user
      - email_host_password
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/cosmae/contributions:/srv/cosmae/contributions
    image: 127.0.0.1:5000/cosmae_django
    command: [
      "python",
      "manage.py",
      "rqworker",
      "--with-scheduler"
    ]

  django:
    build:
      context: ./
      dockerfile: container/django_dockerfile
    restart: unless-stopped
    ports:
      - 8000:8000
    expose:
      - 8000
    secrets:
      - cosmae_django_key
      - cosmae_db_name
      - cosmae_db_user
      - cosmae_db_password
      - cosmae_redis_password
      - orcid_client_id
      - orcid_client_secret
      - email_host
      - email_host_user
      - email_host_password
    volumes:
      - /srv/cosmae/contributions:/srv/cosmae/contributions
      - /etc/localtime:/etc/localtime:ro
    image: 127.0.0.1:5000/cosmae_django
    # command: [
    #   'gunicorn',
    #   'django_project.asgi:application',
    #   '-k',
    #   'uvicorn.workers.UvicornWorker',
    #   '-b 0.0.0.0:8000',
    #   '--log-level',
    #   'debug'
    # ]

  db:
    container_name: cosmae_db
    image: postgres:15.4
    shm_size: 265m
    restart: unless-stopped
    ports:
      - 127.0.0.1:5432:5432
    expose:
      - 5432
    environment:
    - POSTGRES_PASSWORD_FILE=/run/secrets/cosmae_db_password
    - POSTGRES_USER_FILE=/run/secrets/cosmae_db_user
    - POSTGRES_DB_FILE=/run/secrets/cosmae_db_name
    secrets:
    - cosmae_db_password
    - cosmae_db_user
    - cosmae_db_name
    volumes:
    - cosmae_db_volume:/var/lib/postgresql/data
    - /etc/localtime:/etc/localtime:ro

  redis:
    container_name: cosmae_redis
    build:
      context: ./
      dockerfile: container/redis_dockerfile
    image: 127.0.0.1:5000/cosmae_redis
    expose:
      - 6379
    volumes:
      - cosmae_redis_volume:/data
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - cosmae_redis_conf
    command: [
      "redis-server",
      "/etc/redis/redis.conf"
    ]
    restart: unless-stopped

[tool.poetry]
name = "cosmae"
version = "0.1.0"
description = ""
authors = ["Moritz Fürneisen <m.fuerneisen@zbw.eu>"]
readme = "README.md"
packages = [{include = "cosmae"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
django = "^6.0.1"
django-ninja = "<1.6,>=1.1.0"
pydantic = ">=2.11,<2.13"
django-cors-headers = "^4.6.0"
pandas = "^2.0.1"
django-rq = "^3.0.0"
psycopg = "^3.3.2"
levenshtein = "^0.27.3"
sqlparse = ">=0.5.0,<1.0.0"
django-allauth = {extras = ["mfa"], version = "^65.14"}
requests = "^2.32.3"
# upgrade dependencies due to vulnerabilities.
urllib3 = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
black = "*"
coverage = "*"
pdoc3 = "*"
pre-commit = "*"
isort = "*"
pylint = "*"
pytest-django = "^4.5.2"
python-dotenv = "^1.0.1"
pytest-redis = "^3.1.3"
pip = "^25.0"
pylint-django = "^2.6.1"
setuptools = "^80.9.0"
ipykernel = "^6.29.5"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

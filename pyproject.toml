[tool.poetry]
name = "cosmae"
version = "0.1.0"
description = ""
authors = ["Moritz Fürneisen <m.fuerneisen@zbw.eu>"]
readme = "README.md"
packages = [{include = "cosmae"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
django = "^5.1.0"
django-ninja = "^1.1.0"
django-cors-headers = "^4.3.1"
pandas = "^2.0.1"
django-rq = "^2.10.1"
psycopg = "^3.1.9"
levenshtein = "^0.25.1"
sqlparse = ">=0.5.0,<1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
black = "*"
coverage = "*"
pdoc3 = "*"
pre-commit = "*"
isort = "*"
pylint = "*"
pytest-django = "^4.5.2"
requests = "^2.32.0"
python-dotenv = "^0.21.0"
pytest-redis = "^3.0.2"
pip = "^24.0"
pylint-django = "^2.6.1"
setuptools = "^72.1.0"
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

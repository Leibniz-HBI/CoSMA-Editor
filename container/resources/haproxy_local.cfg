global
log stdout format raw local0

defaults
  mode http
  maxconn 2000
  timeout client 30s
  timeout connect 15s
  timeout server 30s
  timeout http-request 30s
  timeout http-keep-alive 15s
  timeout tarpit 30s
  timeout queue 30s
  timeout client-fin 20s
  timeout check 30s
  log global
  option httplog

frontend myfrontend
  bind *:80
  use_backend cosmae_django if { path /api } || { path_beg /api } || { path_beg /auth } || { path_beg /accounts }
  use_backend cosmae_saml if { path_beg /realms }
  default_backend cosmae_ui

backend cosmae_ui
  server ui1 host.docker.internal:3000

backend cosmae_django
  http-request replace-path /api(/)?(.*) /cosmae/api/\2
  http-request replace-path /auth(/)?(.*) /_allauth/browser/v1/\2
  server django1 host.docker.internal:8000

backend cosmae_saml
  server saml1 cosmae_saml:8080

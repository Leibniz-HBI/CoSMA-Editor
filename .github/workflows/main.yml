name: CoSMA-Editor tests

on:
  pull_request:
    branches: ["trunk"]

jobs:
  backend:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3
      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Install redis
        run: |
          curl -fsSL https://packages.redis.io/gpg | gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update
          sudo apt-get -y install redis
      - name: Setup Python # Set Python version
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'
          cache-dependency-path: |
            pyproject.toml
            poetry.lock
      # workaround for 3.8
      - name: Install dependencies
        run: |
          poetry env use ${{ matrix.python-version }}
          poetry install --no-interaction
      - name: Test with pytest
        run: |
          if [[ ${{ matrix.python-version }} == '3.9' ]]; then
            COSMAE_REDIS_PORT=6309 poetry run pytest --cov-report html:coverage-${{ matrix.python-version }}
          fi
          if [[ ${{ matrix.python-version }} == '3.10' ]]; then
            COSMAE_REDIS_PORT=6310 poetry run pytest --cov-report html:coverage-${{ matrix.python-version }}
          fi
          if [[ ${{ matrix.python-version }} == '3.11' ]]; then
            COSMAE_REDIS_PORT=6311 poetry run pytest --cov-report html:coverage-${{ matrix.python-version }}
          fi
        env:
          COSMAE_CI: "True"
          COSMAE_DB_NAME: ${{ secrets.COSMAE_DB_NAME }}
          COSMAE_DB_USER: ${{ secrets.COSMAE_DB_USER }}
          COSMAE_DB_PASSWORD: ${{ secrets.COSMAE_DB_PASSWORD }}
          COSMAE_PG_CONF: ${{ secrets.COSMAE_PG_CONF}}
          COSMAE_PG_SERVICE_FILE: ${{ secrets.COSMAE_PG_SERVICE_FILE }}
          COSMAE_DJANGO_KEY: ${{ secrets.COSMAE_DJANGO_KEY }}
          COSMAE_REDIS_PASSWORD: ""
          COSMAE_REDIS_CONF: ""
      - name: Upload pytest test results
        uses: actions/upload-artifact@v3
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "ui"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: test frontend
        run: npm run test

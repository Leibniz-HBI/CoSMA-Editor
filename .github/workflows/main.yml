name: CoSMA-Editor Tests

on:
  pull_request:
    branches: ["trunk"]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:15.4
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: cosmae_db_user_ci
          POSTGRES_PASSWORD: cosmae_db_password_ci
          POSTGRES_DB: cosmae_data_ci
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: install whois for mkpasswd
        run: |
          sudo apt-get update
          sudo apt-get install -y whois
      - name: Install poetry
        run: |
          sudo apt-get install -y pipx
          pipx install poetry
      - name: Install redis
        run: |
          curl -fsSL https://packages.redis.io/gpg | gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update
          sudo apt-get -y install redis
      - name: Setup Python # Set Python version
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
          cache-dependency-path: |
            pyproject.toml
            poetry.lock
      - name: Install dependencies
        run: |
          ~/.local/bin/poetry env use ${{ matrix.python-version }}
          ~/.local/bin/poetry install --no-interaction
      - name: Test with pytest
        run: |
          if [[ ${{ matrix.python-version }} == '3.12' ]]; then
            COSMAE_REDIS_PORT=6312 ~/.local/bin/poetry run pytest -c pytest_ci.ini --cov-report html:coverage-${{ matrix.python-version }}
          fi
        env:
          COSMAE_CI: "True"
          COSMAE_DB_NAME: cosmae_data_ci
          COSMAE_DB_USER: cosmae_db_user_ci
          COSMAE_DB_PASSWORD: cosmae_db_password_ci
          COSMAE_PG_CONF: localhost:5432:cosmae_data_ci:cosmae_db_user_ci:cosmae_db_password_ci
          COSMAE_PG_SERVICE_FILE: "[cosmae_service]\nhost=localhost\nuser=cosmae_db_user_ci\ndbname=cosmae_data_ci\nport=5432"
          COSMAE_DJANGO_KEY: ${{ secrets.COSMAE_DJANGO_KEY }}
          SAML_CLIENT_PRIVATE_KEY: "no-saml-in_ci"
          COSMAE_REDIS_PASSWORD: ""
          COSMAE_REDIS_CONF: ""
          EMAIL_HOST_USER: "test.org"
          EMAIL_HOST_APP_PASSWORD: "test7845#&($"
          ORCID_CLIENT_ID: orcid_test_client_id
          ORCID_CLIENT_SECRET: orcid_test_client_secret
      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "ui"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Generate openapi clients
        run: npm run openapi
      - name: test frontend
        run: npm run test

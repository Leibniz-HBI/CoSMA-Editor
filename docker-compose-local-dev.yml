services:
  cosmae_db:
    container_name: cosmae_db
    image: postgres:15.4
    shm_size: 265m
    restart: unless-stopped
    ports:
      - 127.0.0.1:5444:5432
    expose:
      - 5432
    environment:
    - POSTGRES_PASSWORD_FILE=/run/secrets/cosmae_db_password
    - POSTGRES_USER_FILE=/run/secrets/cosmae_db_user
    - POSTGRES_DB_FILE=/run/secrets/cosmae_db_name
    volumes:
    - /srv/cosmae/postgres:/var/lib/postgresql/data
    - ./.secrets_local:/run/secrets
    - /etc/localtime:/etc/localtime:ro

  cosmae_redis:
    container_name: cosmae_redis
    image: redis:7.0-alpine
    restart: unless-stopped
    expose:
      - 6379
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - /etc/localtime:/etc/localtime:ro

  cosmae_saml:
    container_name: cosmae_saml
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    #  docker run    -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    expose:
      - 8080
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - /srv/cosmae/keycloak:/opt/keycloak/data/h2
      - /etc/localtime:/etc/localtime/ro
    command: [
      "start-dev",
      "--log-console-level=debug"
      ]
